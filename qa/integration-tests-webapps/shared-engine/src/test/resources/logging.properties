handlers = java.util.logging.ConsoleHandler

############################################################
# Handler specific properties.
############################################################

java.util.logging.ConsoleHandler.level = FINEST
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=[%1$tF %1$tT] [%4$s] %3$s: %5$s%6$s%n

############################################################
# Root and Tomcat logging levels
############################################################

# Root level
.level = INFO

# Tomcat internals
org.apache.catalina.level = FINE
org.apache.catalina.startup.HostConfig.level = FINE
org.apache.catalina.startup.ContextConfig.level = FINE
org.apache.catalina.core.StandardContext.level = FINE
org.apache.catalina.loader.WebappClassLoaderBase.level = FINE
org.apache.tomcat.util.descriptor.level = FINE

# Servlet container initializer discovery (process application deployer)
org.apache.catalina.core.level = FINE

# CIB seven engine and process application
org.cibseven.level = FINE

# Jersey (JAX-RS)
org.glassfish.jersey.level = INFO
org.glassfish.hk2.level = INFO

# RESTEasy
org.jboss.resteasy.level = INFO

# Errors only for noisy loggers
org.apache.tomcat.util.net.level = INFO
