# Connection parameters of the externally hosted Aurora PostgreSQL clusters, the profiles aurora15
# to aurora18 of database/pom.xml. pgjdbc reads this file when the URL names the service and the
# environment variable PGSERVICEFILE points here. Host, port and database name are in the URL, which
# wins over this file.
#
# connectTimeout and loginTimeout are in seconds, sslResponseTimeout in milliseconds.
# sslResponseTimeout is the one that matters while a cluster resumes from auto-pause: it limits the
# wait for the answer to the SSL upgrade request and defaults to 5s.
# gssEncMode=disable skips the GSSAPI upgrade request, which these clusters do not use and which
# otherwise burns another 5s (gssResponseTimeout) before the SSL request is sent.
[aurora]
sslmode=require
gssEncMode=disable
connectTimeout=90
loginTimeout=90
sslResponseTimeout=90000
