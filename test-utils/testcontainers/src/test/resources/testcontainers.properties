# Docker image repositories used by the Camunda*ContainerProvider classes.
# The image tag is taken from the JDBC URL, e.g. jdbc:tc:cibpostgresql:17:///... (see database/pom.xml).
# Each entry can be overridden via the environment variable TESTCONTAINERS_<LABEL>_CONTAINER_IMAGE.
postgresql.container.image=postgres

# MariaDB/MySQL use the public images, the READ-COMMITTED isolation level is set via command line in the providers
mariadb.container.image=mariadb
mysql.container.image=mysql
mssql.container.image=mcr.microsoft.com/mssql/server

# IBM publishes Db2 12.x only to icr.io; ibmcom/db2 on Docker Hub ends with 11.5.x
db2.container.image=icr.io/db2_community/db2

# Oracle XE (up to 21) and Oracle AI Database Free (26ai, tags 23.26.x)
oracle.container.image=gvenzl/oracle-xe
oraclefree.container.image=gvenzl/oracle-free

# Oracle 19c Enterprise Edition, requires a login to the Oracle Container Registry
oracle19.container.image=container-registry.oracle.com/database/enterprise
