# Docker image repositories used by the Camunda*ContainerProvider classes.
# The image tag is taken from the JDBC URL, e.g. jdbc:tc:cibpostgresql:17:///... (see database/pom.xml).
# Each entry can be overridden via the environment variable TESTCONTAINERS_<LABEL>_CONTAINER_IMAGE
# or in ~/.testcontainers.properties.
#
# The images are pulled via the proxy projects of harbor.cib.de, which requires `docker login harbor.cib.de`.
# Without a Harbor account, override the entries with the public images noted next to them.

# public: postgres
postgresql.container.image=harbor.cib.de/proxy-dockerhub/library/postgres

# MariaDB/MySQL use the Docker Hub images, the READ-COMMITTED isolation level is set via command line in the providers
# public: mariadb, mysql
mariadb.container.image=harbor.cib.de/proxy-dockerhub/library/mariadb
mysql.container.image=harbor.cib.de/proxy-dockerhub/library/mysql

# public: mcr.microsoft.com/mssql/server
mssql.container.image=harbor.cib.de/proxy-mcr/mssql/server

# IBM publishes Db2 12.x only to icr.io; ibmcom/db2 on Docker Hub ends with 11.5.x. Harbor has no proxy for icr.io.
db2.container.image=icr.io/db2_community/db2

# Oracle XE (up to 21) and Oracle AI Database Free (26ai, tags 23.26.x)
# public: gvenzl/oracle-xe, gvenzl/oracle-free
oracle.container.image=harbor.cib.de/proxy-dockerhub/gvenzl/oracle-xe
oraclefree.container.image=harbor.cib.de/proxy-dockerhub/gvenzl/oracle-free

# Oracle 19c Enterprise Edition
# public: container-registry.oracle.com/database/enterprise (requires a login and the accepted license)
oracle19.container.image=harbor.cib.de/proxy-oracle-container-registry/database/enterprise
