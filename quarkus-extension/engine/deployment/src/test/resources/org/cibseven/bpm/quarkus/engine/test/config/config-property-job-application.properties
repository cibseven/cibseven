quarkus.datasource.jdbc.url=jdbc:h2:mem:camunda;TRACE_LEVEL_FILE=0;DB_CLOSE_ON_EXIT=FALSE
quarkus.cibseven.generic-config.enforce-history-time-to-live=false

# the delegate is only referenced through a BPMN delegate expression, so it must not be
# removed as an unused bean
quarkus.arc.remove-unused-beans=framework

# CIB7-1959 resolved by a CDI bean that is created lazily on a job executor thread
cibseven.test.config-property-job.value=configured-value
