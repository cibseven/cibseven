name: Renovate

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}
  # TEMPORARY: push trigger so this can run directly from this feature branch
  # (workflow_dispatch/schedule only work once this file is merged to main).
  # Disabled (commented out) to stop firing on every push; uncomment to
  # re-enable testing on this branch, and remove entirely before merging to main.
  push:
    branches:
      - cibseven-CIB-1326

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: renovatebot/github-action@v46.2.0
        with:
          configurationFile: .github/renovate.json5
          token: '${{ secrets.RENOVATE_TOKEN }}'
        env:
          RENOVATE_REPOSITORIES: '["cibseven/cibseven"]'
          LOG_LEVEL: debug
          # TEMPORARY: avoid real branch/PR writes while we're just diagnosing config resolution.
          RENOVATE_DRY_RUN: full
