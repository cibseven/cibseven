name: Renovate

on:
  # TEMPORARY: scheduled runs disabled for now - manual trigger only while the rollout is being
  # verified. Uncomment the schedule block below to resume automatic daily runs.
  # schedule:
  #   - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: renovatebot/github-action@v46.2.0
        with:
          configurationFile: .github/renovate.json5
          token: '${{ secrets.RENOVATE_TOKEN }}'
        env:
          RENOVATE_REPOSITORIES: '["cibseven/cibseven"]'
