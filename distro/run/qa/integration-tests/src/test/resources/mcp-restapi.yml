# CIB seven Run with the MCP REST API of configuration/userlib-ai/ (McpRestApiIT)
camunda.bpm:
  admin-user:
    id: demo
    password: demo

spring.datasource:
  url: jdbc:h2:mem:process-engine;TRACE_LEVEL_FILE=0;DB_CLOSE_ON_EXIT=FALSE
  driver-class-name: org.h2.Driver
  username: sa
  password: sa

spring.ai.mcp.server:
  name: cibseven-run-qa
  version: 1.0.0
  type: SYNC
  protocol: STATELESS
  streamable-http:
    mcp-endpoint: /mcp
  annotation-scanner:
    enabled: false

# as in configuration/default.yml of the distribution
springdoc.api-docs.path: /webapp/v3/api-docs

cibseven:
  webclient:
    authentication:
      jwtSecret: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
  mcp:
    restapi-mcp: true
  openapi:
    # McpRestApiIT replaces it with the path of openapi.json of this CIB seven version
    url: '@OPENAPI_FILE@'
